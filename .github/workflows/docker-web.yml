# Membangun image container website setiap ada push ke main yang mengubah apps/web,
# lalu menyimpannya di GitHub Container Registry. NAS Synology menarik image ini.
name: Build image website (NAS)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/docker-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/teddytjahyanto12-hue/dokteredukasi-web:latest
            ghcr.io/teddytjahyanto12-hue/dokteredukasi-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
